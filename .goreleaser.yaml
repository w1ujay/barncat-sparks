version: 2

builds:
  - id: windows
    main: ./cmd/barncat-sparks/
    binary: barncat-sparks
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -H windowsgui
      - -X github.com/ujay/barncat-sparks/internal/config.Version={{.Version}}
    hooks:
      pre:
        - cmd: go-winres make
          dir: cmd/barncat-sparks/
  - id: linux-arm64
    main: ./cmd/barncat-sparks/
    binary: barncat-sparks
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
    ldflags:
      - -s -w
      - -X github.com/ujay/barncat-sparks/internal/config.Version={{.Version}}

archives:
  - id: windows
    ids: [windows]
    formats: [zip]
    files:
      - LICENSE*
      - README*
      - CHANGELOG*
      - THIRD_PARTY_NOTICES*
  - id: linux
    ids: [linux-arm64]
    formats: [tar.gz]
    files:
      - LICENSE*
      - README*
      - CHANGELOG*
      - THIRD_PARTY_NOTICES*

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  name_template: "BarnCat Sparks v{{.Version}}"
  prerelease: auto # a tag with a suffix (v1.2.3-rc.1) is a pre-release, never "Latest"

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))?!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\(.+\))?!?:.+$'
      order: 1
    - title: Refactoring
      regexp: '^.*?refactor(\(.+\))?!?:.+$'
      order: 2
    - title: Documentation
      regexp: '^.*?docs(\(.+\))?!?:.+$'
      order: 3
    - title: Other
      order: 999
