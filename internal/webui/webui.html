<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BarnCat Sparks — WinKeyer &amp; MIDI Controller</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:#1e1e1e;color:#d4d4d4;line-height:1.5;padding:20px;max-width:720px;margin:0 auto}
h1{font-size:1.3em;margin-bottom:16px;color:#e0e0e0}
h2{font-size:1.05em;color:#569cd6;margin:18px 0 10px;border-bottom:1px solid #333;padding-bottom:4px}
label{display:block;font-size:0.85em;color:#9cdcfe;margin-bottom:2px}
input,select{background:#2d2d2d;color:#d4d4d4;border:1px solid #444;border-radius:3px;
  padding:5px 8px;font-size:0.9em;width:100%}
input:focus,select:focus{outline:none;border-color:#569cd6}
select{cursor:pointer}
button{background:#0e639c;color:#fff;border:none;border-radius:3px;padding:6px 16px;
  font-size:0.9em;cursor:pointer}
button:hover{background:#1177bb}
button:disabled{background:#3a3a3a;color:#666;cursor:default}
button.danger{background:#a1260d}
button.danger:hover{background:#c4391a}
button.secondary{background:#333;color:#ccc}
button.secondary:hover{background:#444}
.form-row{display:grid;grid-template-columns:140px 1fr;align-items:center;gap:6px;margin-bottom:8px}
.form-row label{margin-bottom:0}
.btn-bar{display:flex;gap:8px;margin-top:14px}
.btn-bar .spacer{flex:1}
.status-bar{margin-top:14px;padding:8px 12px;background:#252526;border:1px solid #333;
  border-radius:3px;font-size:0.85em;color:#ccc}
.status-bar.running{border-color:#4ec9b0;color:#4ec9b0}
table.mappings{width:100%;border-collapse:collapse;margin:8px 0;font-size:0.85em}
table.mappings th{text-align:left;padding:4px 6px;color:#9cdcfe;border-bottom:1px solid #444;font-weight:600}
table.mappings td{padding:4px 6px;vertical-align:middle}
table.mappings input,table.mappings select{font-size:0.85em;padding:3px 5px}
table.mappings .col-action{width:28%}
table.mappings .col-type{width:14%}
table.mappings .col-ch{width:10%}
table.mappings .col-num{width:10%}
table.mappings .col-opts{width:30%}
table.mappings .col-rm{width:8%;text-align:center}
.opts-field{display:inline-flex;align-items:center;gap:4px}
.opts-field label{display:inline;font-size:0.8em;white-space:nowrap}
.opts-field input{width:70px}
.no-mappings{color:#666;font-style:italic;padding:8px 0}
.mapping-btns{display:flex;gap:6px;margin-top:4px}
details summary{font-size:0.85em;color:#9cdcfe;cursor:pointer;margin-bottom:4px}
details summary:hover{color:#569cd6}
.about{margin-top:18px;padding:12px;background:#252526;border:1px solid #333;border-radius:3px;
  font-size:0.8em;color:#888;text-align:center}
.about strong{color:#9cdcfe}
.radio-group{display:flex;gap:12px}
.radio-group label{display:inline-flex;align-items:center;gap:4px;cursor:pointer;font-size:0.9em}
.radio-group input[type="radio"]{width:auto;margin:0}
.mapping-card{background:#252526;border:1px solid #333;border-radius:3px;padding:8px 10px;margin-bottom:6px}
.mapping-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.mapping-label{color:#4ec9b0;font-weight:600;font-size:0.9em}
.mapping-body{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mapping-body select,.mapping-body input{font-size:0.85em;padding:3px 5px}
.mapping-body select{width:auto}
.mapping-body input[type="number"]{width:55px}
.mapping-field{display:inline-flex;align-items:center;gap:3px}
.mapping-field>label{font-size:0.8em;color:#888;white-space:nowrap;display:inline}
.learn-msg{font-size:0.85em;color:#f48771}
.midi-device-list label{display:block;padding:3px 0;font-size:0.9em;cursor:pointer}
.midi-device-list input[type="checkbox"]{width:auto;margin-right:6px}
.inline-row{display:flex;gap:6px}
.inline-row input{flex:1}
[hidden]{display:none!important}
a{color:#569cd6}
.tabs{display:flex;gap:6px;border-bottom:1px solid #333;padding-bottom:6px;margin-bottom:14px}
.tabs button{background:#333;color:#ccc}
.tabs button:hover{background:#444}
.tabs button.active{background:none;color:#569cd6;box-shadow:inset 0 -2px 0 #569cd6}
.save-msg{font-size:0.85em;color:#888;align-self:center}
.save-msg.error{color:#f48771}
.station-row{display:grid;grid-template-columns:130px 1fr auto auto;gap:6px;align-items:center;margin-bottom:6px}
.station-label{font-size:0.85em;color:#9cdcfe;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.station-value{font-size:0.9em}
.station-value.warn{color:#d7ba7d}
.station-source{font-size:0.85em;color:#888;margin:8px 0}
.station-source.live{color:#4ec9b0}
.station-source.warn{color:#d7ba7d}
.station-note{font-size:0.85em;color:#888;min-height:1.3em;margin-bottom:6px}
.station-note.error{color:#f48771}
.radio-link{margin-top:8px;font-size:0.9em;color:#888}
.radio-link.connected{color:#4ec9b0}
.radio-link.no_reply{color:#d7ba7d}
.radio-link.lost{color:#f48771}
.update-bar{margin-bottom:12px;padding:6px 12px;background:#252526;border:1px solid #333;
  border-radius:3px;font-size:0.9em;display:flex;align-items:center;gap:10px}
.update-bar button{padding:3px 10px;font-size:0.9em}
.update-note{color:#888}
.update-note.error{color:#f48771}
</style>
</head>
<body>

<h1 id="appTitle">BarnCat Sparks — WinKeyer &amp; MIDI Controller</h1>

<div class="update-bar" id="updateBar" hidden>
  <a href="#" id="updateLink" onclick="openRelease(); return false"></a>
  <button id="updateBtn" onclick="installUpdate()" hidden>Update now</button>
  <span class="update-note" id="updateNote"></span>
</div>

<nav class="tabs">
  <button id="tabOperate" class="active" onclick="showTab('operate')">Operate</button>
  <button id="tabSettings" onclick="showTab('settings')">Settings</button>
</nav>

<div id="operateView">

<div class="btn-bar">
  <button id="startBtn" onclick="doStart()">Start</button>
  <button id="stopBtn" onclick="doStop()" disabled>Stop</button>
</div>

<div class="status-bar" id="statusBar">Status: Stopped</div>
<div class="radio-link" id="radioLink">Radio: Not connected</div>

<div id="stationSection" hidden>
<h2>Station</h2>
<div id="stationPanel">
  <div class="station-source" id="stationSource">—</div>
  <div class="station-row">
    <span class="station-label">K4</span>
    <span class="station-value" id="k4State">—</span>
    <button id="k4OnBtn" onclick="k4Power('on')" disabled>On</button>
    <button id="k4OffBtn" class="danger" onclick="k4Power('off')" disabled>Off</button>
  </div>
  <div class="station-row">
    <span class="station-label">Power-save</span>
    <span class="station-value" id="psState">—</span>
    <button id="psBtn" onclick="togglePowerSave()" disabled>Arm</button>
  </div>
  <div class="station-row" id="battRow" hidden>
    <span class="station-label">Battery</span>
    <span class="station-value" id="battState">—</span>
  </div>
  <div id="laptopRows"></div>
  <div class="station-note" id="stationMsg"></div>
</div>
</div>

</div>

<div id="settingsView" hidden>

<h2>Connection</h2>
<div class="form-row">
  <label>Radio Connection</label>
  <div class="radio-group">
    <label><input type="radio" name="catTransport" value="tcp" checked onchange="onTransportChange()"> TCP</label>
    <label><input type="radio" name="catTransport" value="serial" onchange="onTransportChange()"> Serial</label>
  </div>
</div>
<div class="form-row" id="tcpModeRow">
  <label for="tcpMode">TCP Mode</label>
  <select id="tcpMode" onchange="onTcpModeChange()">
    <option value="plain">Plain TCP</option>
    <option value="k4auth">K4 Auth (SHA-384)</option>
    <option value="k4tls" disabled>K4 TLS-PSK (not supported)</option>
  </select>
</div>
<div class="form-row" id="catAddrRow">
  <label for="catAddr">K4 Address</label>
  <input id="catAddr" type="text" placeholder="localhost:9299">
</div>
<div class="form-row" id="catPasswordRow" style="display:none">
  <label for="catPassword">Password</label>
  <input id="catPassword" type="password">
</div>
<div class="form-row" id="catSerialRow" style="display:none">
  <label for="catSerialPort">CAT Serial Port</label>
  <select id="catSerialPort"><option value="">(none)</option></select>
</div>
<div class="form-row" id="catBaudRow" style="display:none">
  <label for="catBaud">Baud Rate</label>
  <select id="catBaud">
    <option value="4800">4800</option>
    <option value="9600">9600</option>
    <option value="19200">19200</option>
    <option value="38400" selected>38400</option>
    <option value="57600">57600</option>
    <option value="115200">115200</option>
  </select>
</div>
<div class="form-row">
  <label for="catListen">TCP Server (listen)</label>
  <input id="catListen" type="text" placeholder="(disabled)">
</div>
<div class="form-row">
  <label for="radioServerListen">RadioServer (listen)</label>
  <input id="radioServerListen" type="text" placeholder="(disabled)">
</div>
<div class="form-row">
  <label for="ampUrl">Amplifier URL</label>
  <input id="ampUrl" type="text" placeholder="http://192.168.1.101:8080">
</div>
<div class="form-row">
  <label for="lp100Port">LP-100A Port</label>
  <select id="lp100Port"><option value="">(none)</option></select>
</div>
<div class="form-row">
  <label for="serialPort">WinKeyer Port</label>
  <select id="serialPort"><option value="">(none)</option></select>
</div>
<div class="form-row">
  <label for="keyerSpeed">Keyer Speed (WPM)</label>
  <input id="keyerSpeed" type="number" min="5" max="99" placeholder="25">
</div>

<details id="hearthDetails">
<summary>Station control with lempster-hearth (optional)</summary>
<div class="form-row">
  <label for="hearthUrl">Hearth URL</label>
  <input id="hearthUrl" type="text" placeholder="http://hearth.example:8123">
</div>
<div class="form-row">
  <label for="hearthReplicaUrl">Replica URL</label>
  <input id="hearthReplicaUrl" type="text" placeholder="https://replica.example (optional)">
</div>
<div class="form-row">
  <label for="hearthSite">Site</label>
  <input id="hearthSite" type="text" placeholder="cabin (only for a multi-site hub replica)">
</div>
<div class="form-row">
  <label for="hearthToken">Operator Token</label>
  <div class="inline-row">
    <input id="hearthToken" type="password">
    <button class="secondary" onclick="testHearth()">Test</button>
  </div>
</div>
<div class="station-note" id="hearthIdentity"></div>
</details>

<h2>MIDI</h2>
<div id="midiDevicesContainer"></div>
<div class="mapping-btns">
  <button class="secondary" onclick="rescanMIDI()" title="Rescan MIDI devices">&#x21bb; Rescan</button>
</div>
<details id="mappingsDetails">
  <summary>Mappings</summary>
  <div id="mappingsContainer"></div>
  <div class="mapping-btns">
    <button class="secondary" onclick="addMapping()">+ Add</button>
    <button class="secondary" onclick="removeLastMapping()">- Remove</button>
  </div>
</details>

<h2>Options</h2>
<div>
  <label><input type="checkbox" id="qk4Volume" onchange="toggleQK4Addr()"> Route MIDI volume to QK4</label>
  <span id="qk4AddrWrap" style="display:none">
    <input type="text" id="qk4Address" placeholder="127.0.0.1:9299" size="20">
  </span>
  <label><input type="checkbox" id="minimizeToTray"> Minimize to system tray</label>
  <label><input type="checkbox" id="protocolTrace" onchange="onTraceChange()"> Protocol trace (verbose logging)</label>
  <label><input type="checkbox" id="updatePrereleases" onchange="onPrereleaseChange(this)"> Offer pre-release updates (test builds)</label>
</div>

<!-- Decode section hidden — K4 may not support CW/RTTY decode
<h2>Decode</h2>
<div class="decode-panel">
  <div class="decode-controls">
    <label><input type="checkbox" id="decodeEnabled" onchange="onDecodeToggle()"> Enable CW/RTTY decode</label>
    <button class="secondary" onclick="clearDecode()">Clear</button>
  </div>
  <div class="decode-text" id="decodeText"></div>
</div>
-->

<div class="learn-msg" id="configError" style="display:none"></div>
<div class="btn-bar">
  <button onclick="doSave()">Save Settings</button>
  <span class="save-msg" id="saveMsg"></span>
</div>
<div class="form-row" id="backupRow" style="display:none">
  <label for="backupSelect">Backups</label>
  <select id="backupSelect"></select>
  <button class="secondary" onclick="restoreBackup()">Restore</button>
</div>

<div class="about" id="aboutSection"></div>

</div>

<script>
let actions = [];
let mappings = [];
let midiDevices = [];
let availableMIDIDevices = [];
let controlMaps = {};
let knobEnabled = false;
let knobState = '';   // last /api/knob/status: connected, not_set_up, not_connected, unsupported
const pendingLearns = new Map(); // mapping row → AbortController of its waiting Learn
let statusPoll = null;
let sparksRunning = false;
let hearthIdentity = null;  // last successful whoami for the saved station; decides the station controls
let hearthIdentityRes = null; // last whoami reply for the saved station (identity or {error})
let savedHearth = null;       // {url, replica_url, token} the station was last started with
let hearthStatus = null;    // last /api/hearth/status
let hearthPoll = null;

async function init() {
  const [actResp, cfgResp, portsResp, midiResp, ctrlResp, statusResp, aboutResp] = await Promise.all([
    fetch('/api/actions'),
    fetch('/api/config'),
    fetch('/api/serial-ports'),
    fetch('/api/midi-devices'),
    fetch('/api/control-names'),
    fetch('/api/status'),
    fetch('/api/about')
  ]);
  actions = await actResp.json();
  const cfg = await cfgResp.json();
  const ports = await portsResp.json();
  const devices = await midiResp.json();
  controlMaps = await ctrlResp.json();
  const status = await statusResp.json();
  const about = await aboutResp.json();

  document.getElementById('appTitle').textContent = 'BarnCat Sparks ' + about.version + ' — WinKeyer & MIDI Controller';
  document.title = 'BarnCat Sparks ' + about.version;
  renderAbout(about);

  populateSelect('serialPort', ports, cfg.serial_port, '(none)');
  populateSelect('catSerialPort', ports, cfg.cat_serial_port, '(none)');
  populateSelect('lp100Port', ports, cfg.lp100_port, '(none)');
  availableMIDIDevices = devices;
  midiDevices = cfg.midi_devices || (cfg.midi_device ? [cfg.midi_device] : []);
  knobEnabled = !!cfg.knob_enabled;
  renderMIDIDevices();
  refreshKnobStatus();
  refreshBackups();
  document.getElementById('catAddr').value = cfg.cat_address || '';
  document.getElementById('catPassword').value = cfg.cat_password || '';
  document.getElementById('tcpMode').value = cfg.cat_password ? 'k4auth' : 'plain';
  document.getElementById('keyerSpeed').value = cfg.keyer_speed || 25;
  document.getElementById('qk4Volume').checked = cfg.qk4_volume || false;
  document.getElementById('qk4Address').value = cfg.qk4_address || '';
  toggleQK4Addr();
  document.getElementById('minimizeToTray').checked = cfg.minimize_to_tray || false;
  document.getElementById('protocolTrace').checked = cfg.protocol_trace || false;
  document.getElementById('catListen').value = cfg.cat_listen || '';
  document.getElementById('radioServerListen').value = cfg.radio_server_listen || '';
  document.getElementById('ampUrl').value = cfg.amp_url || '';
  document.getElementById('updatePrereleases').checked = !!cfg.update_prereleases;
  document.getElementById('hearthUrl').value = cfg.hearth_url || '';
  document.getElementById('hearthDetails').open = !!cfg.hearth_url;
  document.getElementById('hearthReplicaUrl').value = cfg.hearth_replica_url || '';
  document.getElementById('hearthToken').value = cfg.hearth_token || '';
  document.getElementById('hearthSite').value = cfg.hearth_site || '';

  // Set transport radio
  const transport = cfg.cat_transport || 'tcp';
  document.querySelector('input[name="catTransport"][value="'+transport+'"]').checked = true;
  onTransportChange();

  // Set baud rate
  if (cfg.cat_serial_baud) {
    document.getElementById('catBaud').value = String(cfg.cat_serial_baud);
  }

  mappings = cfg.mappings || [];
  renderMappings();
  applyStatus(status);
  startHearth(cfg.hearth_url || '');
}

async function rescanMIDI() {
  const resp = await fetch('/api/midi-devices');
  availableMIDIDevices = await resp.json();
  renderMIDIDevices();
  refreshKnobStatus();
}

async function refreshKnobStatus() {
  let st = '';
  try {
    const resp = await fetch('/api/knob/status');
    st = (await resp.json()).state || '';
  } catch (e) {
    st = '';
  }
  if (st !== knobState) {
    knobState = st;
    renderMIDIDevices();
  }
}

// showTab switches between the Operate and Settings views. Both stay in the
// document, so gatherConfig() reads the Settings inputs even while hidden.
function showTab(name) {
  const operate = name === 'operate';
  document.getElementById('operateView').hidden = !operate;
  document.getElementById('settingsView').hidden = operate;
  document.getElementById('tabOperate').className = operate ? 'active' : '';
  document.getElementById('tabSettings').className = operate ? '' : 'active';
  if (operate) wolTick();
}

function setSaveMsg(text, isError) {
  const el = document.getElementById('saveMsg');
  el.className = 'save-msg' + (isError ? ' error' : '');
  el.textContent = text;
}

function populateSelect(id, items, selected, placeholder) {
  const sel = document.getElementById(id);
  sel.innerHTML = '<option value="">' + placeholder + '</option>';
  for (const item of items) {
    const opt = document.createElement('option');
    opt.value = item;
    opt.textContent = item;
    if (item === selected) opt.selected = true;
    sel.appendChild(opt);
  }
}

function renderMIDIDevices() {
  const container = document.getElementById('midiDevicesContainer');
  // Merge available + configured (in case a saved device isn't currently plugged in)
  const allDevices = [...new Set([...availableMIDIDevices, ...midiDevices.filter(d => d)])];
  let html = '';
  if (allDevices.length === 0) {
    html += '<div class="no-mappings">(no MIDI devices found — click "Rescan")</div>';
  }
  html += '<div class="midi-device-list">';
  for (const d of allDevices) {
    const checked = midiDevices.includes(d) ? ' checked' : '';
    const avail = availableMIDIDevices.includes(d);
    const suffix = avail ? '' : ' <span style="color:#666">(not connected)</span>';
    html += '<label><input type="checkbox" value="'+d+'"'+checked+' onchange="onMIDIDeviceToggle(this)"> '+d+suffix+'</label>';
  }
  const knobSuffix = {
    not_connected: ' <span style="color:#666">(not connected)</span>',
    not_set_up: ' <span style="color:#d7ba7d">(not set up — replace its driver with WinUSB using Zadig)</span>',
    unsupported: ' <span style="color:#666">(Windows only)</span>'
  }[knobState] || '';
  html += '<label><input type="checkbox" id="knobEnabled"' + (knobEnabled ? ' checked' : '') +
    ' onchange="knobEnabled=this.checked"> iWit USB Controller (knob)' + knobSuffix + '</label>';
  html += '</div>';
  container.innerHTML = html;
}

function onMIDIDeviceToggle(cb) {
  if (cb.checked) {
    if (!midiDevices.includes(cb.value)) midiDevices.push(cb.value);
  } else {
    midiDevices = midiDevices.filter(d => d !== cb.value);
  }
}

function getControlName(type, channel, number) {
  if (type === 'knob') {
    const n = number || 0;
    const names = controlMaps.knob || {};
    const name = names['knob:' + (channel || 3) + ':' + n];
    if (name) return name;
    return n > 0 ? 'Code 0x' + n.toString(16).toUpperCase().padStart(2, '0') : 'Not learned yet';
  }
  const key = (type || 'cc') + ':' + (channel || 0) + ':' + (number || 0);
  for (const [pattern, cmap] of Object.entries(controlMaps)) {
    if (pattern === 'knob') continue;
    for (const dev of midiDevices) {
      if (dev.indexOf(pattern) !== -1) {
        if (cmap[key]) return cmap[key];
      }
    }
  }
  return '';
}

function renderMappings() {
  const container = document.getElementById('mappingsContainer');
  document.querySelector('#mappingsDetails summary').textContent =
    'Mappings' + (mappings.length ? ' (' + mappings.length + ')' : '');
  if (mappings.length === 0) {
    container.innerHTML = '<div class="no-mappings">(no mappings — click "+ Add" to create one)</div>';
    return;
  }
  let html = '';
  for (let i = 0; i < mappings.length; i++) {
    const m = mappings[i];
    const act = actions.find(a => a.name === m.action);
    const label = act ? act.label : '(unassigned)';
    const ctrlName = getControlName(m.type, m.channel, m.number);
    const ctrlDisplay = ctrlName ? ' <span style="color:#888;font-weight:normal">— ' + ctrlName + '</span>' : '';
    let body;
    if (m.type === 'knob') {
      body = actionSelect(i, m.action, 'knob') +
        typeSelect(i, m.type) +
        '<button class="secondary" id="learnBtn'+i+'" onclick="learnKnob('+i+')"' + (pendingLearns.has(m) ? ' disabled>Move the knob…' : '>Learn') + '</button>' +
        directionSelect(i, m) +
        optsFields(i, m.action, m.opts) +
        '<span class="learn-msg" id="learnMsg'+i+'"></span>';
    } else {
      body = actionSelect(i, m.action, m.type) +
        typeSelect(i, m.type) +
        '<span class="mapping-field"><label>Ch</label><input type="number" min="0" max="15" value="'+(m.channel||0)+'" onchange="mappings['+i+'].channel=parseInt(this.value)||0"></span>' +
        '<span class="mapping-field"><label>#</label><input type="number" min="0" max="127" value="'+(m.number||0)+'" onchange="mappings['+i+'].number=parseInt(this.value)||0"></span>' +
        '<button class="secondary" id="learnBtn'+i+'" onclick="learnMIDI('+i+')"' + (pendingLearns.has(m) ? ' disabled>Move the control…' : '>Learn') + '</button>' +
        optsFields(i, m.action, m.opts) +
        '<span class="learn-msg" id="learnMsg'+i+'"></span>';
    }
    html += '<div class="mapping-card">' +
      '<div class="mapping-header">' +
        '<span class="mapping-label">' + (i+1) + '. ' + label + ctrlDisplay + '</span>' +
        '<button class="danger" onclick="removeMapping('+i+')" title="Remove">&times;</button>' +
      '</div>' +
      '<div class="mapping-body">' + body + '</div>' +
    '</div>';
  }
  container.innerHTML = html;
}

// knobActions are the actions a knob gesture can run: step actions and
// single-press buttons. Sliders and hold actions (PTT) need other controls.
function knobActions() {
  return actions.filter(a => a.kind === 'relative' || (a.kind === 'button' && !a.momentary));
}

function actionSelect(idx, selected, rowType) {
  const list = rowType === 'knob' ? knobActions() : actions;
  let html = '<select onchange="onActionChange('+idx+',this.value)">';
  html += '<option value="">—</option>';
  for (const a of list) {
    const sel = a.name === selected ? ' selected' : '';
    html += '<option value="'+a.name+'"'+sel+'>'+a.label+'</option>';
  }
  html += '</select>';
  return html;
}

function typeSelect(idx, selected) {
  const types = [['cc','CC'],['note_on','Note On'],['knob','Knob']];
  let html = '<select onchange="onTypeChange('+idx+',this.value)">';
  for (const [val,label] of types) {
    const sel = val === selected ? ' selected' : '';
    html += '<option value="'+val+'"'+sel+'>'+label+'</option>';
  }
  html += '</select>';
  return html;
}

function directionSelect(idx, m) {
  const act = actions.find(a => a.name === m.action);
  if (!act || act.kind !== 'relative') return '';
  if (!m.opts) m.opts = {};
  if (m.opts.direction !== 1 && m.opts.direction !== -1) m.opts.direction = 1;
  const dir = m.opts.direction;
  return '<span class="mapping-field"><label>Direction</label>' +
    '<select id="knobDir'+idx+'" onchange="setDirection('+idx+',this.value)">' +
    '<option value="1"'+(dir === 1 ? ' selected' : '')+'>+</option>' +
    '<option value="-1"'+(dir === -1 ? ' selected' : '')+'>−</option>' +
    '</select></span>';
}

function setDirection(idx, value) {
  if (!mappings[idx].opts) mappings[idx].opts = {};
  mappings[idx].opts.direction = parseInt(value);
}

function onTypeChange(idx, type) {
  const m = mappings[idx];
  cancelLearn(m);
  m.type = type;
  if (type === 'knob') {
    m.channel = 3;
    m.number = 0;
    const act = actions.find(a => a.name === m.action);
    if (m.action && !knobActions().includes(act)) {
      m.action = '';
      m.opts = {};
    } else if (act && act.kind === 'relative') {
      if (!m.opts) m.opts = {};
      if (m.opts.direction !== 1 && m.opts.direction !== -1) m.opts.direction = 1;
    }
  } else if (m.opts) {
    delete m.opts.direction;
  }
  renderMappings();
}

// cancelLearn stops a Learn still waiting on row, so a late answer can't
// overwrite a row the user changed or removed. Aborting the request also ends
// the server's Learn right away instead of after its 10 seconds.
function cancelLearn(row) {
  const ctl = pendingLearns.get(row);
  if (ctl) {
    pendingLearns.delete(row);
    ctl.abort();
  }
}

function learnKnob(idx) {
  return runLearn(idx, '/api/knob/learn', {}, 'Move the knob…', (row, data) => {
    row.channel = 3;
    row.number = data.usage;
  });
}

function learnMIDI(idx) {
  return runLearn(idx, '/api/midi/learn', {devices: midiDevices}, 'Move the control…', (row, data) => {
    row.type = data.type;
    row.channel = data.channel;
    row.number = data.number;
    // Two rows on one control: the MIDI index keeps only the later row.
    const other = mappings.findIndex(m => m !== row && m.type === row.type && m.channel === row.channel && m.number === row.number);
    return other >= 0 ? 'Also on row ' + (other + 1) + ' — only one will work' : '';
  });
}

// runLearn waits on url for the next control and hands the reply to apply,
// which fills in the row and may return a note to show on it.
async function runLearn(idx, url, body, waitText, apply) {
  const row = mappings[idx];
  if (pendingLearns.has(row)) return;
  const ctl = new AbortController();
  pendingLearns.set(row, ctl);
  const btn = document.getElementById('learnBtn' + idx);
  const msg = document.getElementById('learnMsg' + idx);
  btn.disabled = true;
  btn.textContent = waitText;
  msg.textContent = '';
  // The row may have moved while we waited, so find its elements again.
  const showMsg = text => {
    const m = document.getElementById('learnMsg' + mappings.indexOf(row));
    if (m) m.textContent = text;
  };
  let learned = false;
  let note = '';
  try {
    const resp = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
      signal: ctl.signal
    });
    const data = await resp.json();
    if (pendingLearns.get(row) !== ctl) return; // cancelled: the row was changed or removed
    if (!resp.ok) {
      showMsg(data.error || ('Learn failed (' + resp.status + ')'));
      return;
    }
    note = apply(row, data) || '';
    learned = true;
  } catch (e) {
    if (pendingLearns.get(row) === ctl) showMsg('Learn failed: ' + e.message);
  } finally {
    if (pendingLearns.get(row) === ctl) {
      pendingLearns.delete(row);
      const b = document.getElementById('learnBtn' + mappings.indexOf(row));
      if (b) {
        b.disabled = false;
        b.textContent = 'Learn';
      }
      if (learned) {
        renderMappings();
        showMsg(note);
      }
    }
  }
}

function optsFields(idx, actionName, opts) {
  const act = actions.find(a => a.name === actionName);
  if (!act || !act.options || act.options.length === 0) return '';
  let html = '';
  for (const o of act.options) {
    const val = (opts && opts[o.key] !== undefined) ? opts[o.key] : o.default;
    html += '<span class="opts-field"><label>'+o.label+':</label>' +
      '<input type="text" value="'+val+'" onchange="setOpt('+idx+',\''+o.key+'\',this.value)"></span>';
  }
  return html;
}

function setOpt(idx, key, value) {
  if (!mappings[idx].opts) mappings[idx].opts = {};
  const num = parseFloat(value);
  mappings[idx].opts[key] = isNaN(num) ? value : num;
}

function onActionChange(idx, actionName) {
  mappings[idx].action = actionName;
  mappings[idx].opts = {};
  // Populate defaults
  const act = actions.find(a => a.name === actionName);
  if (act && act.options) {
    for (const o of act.options) {
      const num = parseFloat(o.default);
      mappings[idx].opts[o.key] = isNaN(num) ? o.default : num;
    }
  }
  if (mappings[idx].type === 'knob' && act && act.kind === 'relative') {
    mappings[idx].opts.direction = 1;
  }
  renderMappings();
}

function addMapping(entry) {
  mappings.push(entry || {action:'', type:'cc', channel:0, number:0, opts:{}});
  renderMappings();
}

function removeMapping(idx) {
  cancelLearn(mappings[idx]);
  mappings.splice(idx, 1);
  renderMappings();
}

function removeLastMapping() {
  if (mappings.length > 0) {
    removeMapping(mappings.length - 1);
  }
}

function onTransportChange() {
  const transport = document.querySelector('input[name="catTransport"]:checked').value;
  const isTcp = transport === 'tcp';
  document.getElementById('tcpModeRow').style.display = isTcp ? '' : 'none';
  document.getElementById('catAddrRow').style.display = isTcp ? '' : 'none';
  document.getElementById('catSerialRow').style.display = !isTcp ? '' : 'none';
  document.getElementById('catBaudRow').style.display = !isTcp ? '' : 'none';
  if (isTcp) onTcpModeChange();
  else document.getElementById('catPasswordRow').style.display = 'none';
}

function onTcpModeChange() {
  const mode = document.getElementById('tcpMode').value;
  const isAuth = mode === 'k4auth';
  document.getElementById('catPasswordRow').style.display = isAuth ? '' : 'none';
  document.getElementById('catAddr').placeholder = isAuth ? 'k4-hostname:9205' : 'localhost:9299';
}

function toggleQK4Addr() {
  const on = document.getElementById('qk4Volume').checked;
  document.getElementById('qk4AddrWrap').style.display = on ? '' : 'none';
}

async function onTraceChange() {
  const enabled = document.getElementById('protocolTrace').checked;
  try {
    await fetch('/api/trace', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({enabled: enabled})
    });
  } catch(e) { /* server may not be running */ }
}

function gatherConfig() {
  const transport = document.querySelector('input[name="catTransport"]:checked').value;
  return {
    serial_port: document.getElementById('serialPort').value,
    cat_address: document.getElementById('catAddr').value || 'localhost:9299',
    cat_password: document.getElementById('tcpMode').value === 'k4auth' ? document.getElementById('catPassword').value : '',
    cat_transport: transport,
    cat_serial_port: document.getElementById('catSerialPort').value,
    cat_serial_baud: parseInt(document.getElementById('catBaud').value) || 38400,
    cat_listen: document.getElementById('catListen').value,
    radio_server_listen: document.getElementById('radioServerListen').value,
    amp_url: document.getElementById('ampUrl').value,
    lp100_port: document.getElementById('lp100Port').value,
    keyer_speed: parseInt(document.getElementById('keyerSpeed').value) || 25,
    midi_devices: midiDevices.filter(d => d !== ''),
    knob_enabled: knobEnabled,
    qk4_volume: document.getElementById('qk4Volume').checked,
    qk4_address: document.getElementById('qk4Address').value,
    minimize_to_tray: document.getElementById('minimizeToTray').checked,
    protocol_trace: document.getElementById('protocolTrace').checked,
    update_prereleases: document.getElementById('updatePrereleases').checked,
    hearth_url: document.getElementById('hearthUrl').value.trim(),
    hearth_replica_url: document.getElementById('hearthReplicaUrl').value.trim(),
    hearth_token: document.getElementById('hearthToken').value,
    hearth_site: document.getElementById('hearthSite').value.trim(),
    mappings: mappings.map(m => ({
      action: m.action,
      type: m.type || 'cc',
      channel: m.channel || 0,
      number: m.number || 0,
      opts: (m.opts && Object.keys(m.opts).length > 0) ? m.opts : undefined
    }))
  };
}

// backupLabel turns a backup's file name into its date and time.
function backupLabel(name) {
  const m = name.match(/(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})\./);
  return m ? m[1]+'-'+m[2]+'-'+m[3]+' '+m[4]+':'+m[5]+':'+m[6] : name;
}

async function refreshBackups() {
  const resp = await fetch('/api/config/backups');
  if (!resp.ok) return;
  const data = await resp.json();
  const err = document.getElementById('configError');
  err.textContent = data.config_error;
  err.style.display = data.config_error ? '' : 'none';
  document.getElementById('backupRow').style.display = data.backups.length ? '' : 'none';
  const sel = document.getElementById('backupSelect');
  sel.innerHTML = '';
  for (const name of data.backups) {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = backupLabel(name);
    sel.appendChild(opt);
  }
}

async function restoreBackup() {
  const sel = document.getElementById('backupSelect');
  const when = sel.options[sel.selectedIndex].textContent;
  if (!confirm('Replace your settings with the backup from ' + when + '? Your current settings are backed up first.')) return;
  const resp = await fetch('/api/config/restore', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name: sel.value})
  });
  if (resp.ok) {
    location.reload();
  } else {
    const data = await resp.json();
    setSaveMsg('Restore failed: ' + data.error, true);
  }
}

async function doSave() {
  const cfg = gatherConfig();
  const resp = await fetch('/api/config', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(cfg)
  });
  if (resp.ok) {
    setSaveMsg('Settings saved', false);
    startHearth(cfg.hearth_url);
    refreshBackups();
  } else {
    const text = await resp.text();
    setSaveMsg('Save failed: ' + text, true);
  }
}

async function doStart() {
  // Save config into server state first
  const cfg = gatherConfig();
  await fetch('/api/config', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(cfg)
  });
  startHearth(cfg.hearth_url);

  const resp = await fetch('/api/start', {method: 'POST'});
  const status = await resp.json();
  applyStatus(status);
}

async function doStop() {
  const resp = await fetch('/api/stop', {method: 'POST'});
  const status = await resp.json();
  applyStatus(status);
}

function applyStatus(s) {
  sparksRunning = s.running;
  setStatus(s.running, s.message);
  document.getElementById('startBtn').disabled = s.running;
  document.getElementById('stopBtn').disabled = !s.running;
  renderRadio(s);
  renderUpdate();

  if (s.running && !statusPoll) {
    statusPoll = setInterval(pollStatus, 2000);
  } else if (!s.running && statusPoll) {
    clearInterval(statusPoll);
    statusPoll = null;
  }
}

async function pollStatus() {
  try {
    const resp = await fetch('/api/status');
    const s = await resp.json();
    applyStatus(s);
    if (s.running && knobEnabled) refreshKnobStatus();
  } catch(e) { /* server may be gone */ }
}

const RADIO_TEXT = {
  off: 'Not connected',
  checking: 'Checking…',
  connected: 'Connected',
  no_reply: 'Not responding',
  lost: 'Connection lost. Stop, then Start to reconnect'
};

// renderRadio shows whether the K4 or K3 is answering, with or without hearth.
function renderRadio(s) {
  const state = s.running && s.radio in RADIO_TEXT ? s.radio : 'off';
  const el = document.getElementById('radioLink');
  el.textContent = 'Radio: ' + RADIO_TEXT[state];
  el.className = 'radio-link ' + state;
}

function setStatus(running, msg) {
  const bar = document.getElementById('statusBar');
  bar.textContent = 'Status: ' + msg;
  bar.className = 'status-bar' + (running ? ' running' : '');
}

function renderAbout(about) {
  const el = document.getElementById('aboutSection');
  let html = '<strong>BarnCat Sparks ' + about.version + '</strong><br>' + about.tagline;
  if (about.contributors && about.contributors.length > 0) {
    html += '<br><br>Contributors: ' + about.contributors.map(c => {
      let s = '<strong>' + c.callsign + '</strong>';
      if (c.name) s += ' (' + c.name + ')';
      if (c.role) s += ' — ' + c.role;
      return s;
    }).join(', ');
  }
  el.innerHTML = html;
}

// --- Update check ---

const UPDATE_POLL_MS = 2000;
const UPDATE_POLL_TRIES = 12; // a little longer than the server's check timeout
const UPDATE_WATCH_MS = 500;
const UPDATE_STEPS = {downloading: 'Downloading…', installing: 'Installing…', restarting: 'Restarting…'};
let updateInfo = null;  // last /api/update, once a newer release is known

// pollUpdate waits for the startup check, which may finish after the page loads.
async function pollUpdate(triesLeft = UPDATE_POLL_TRIES) {
  let s;
  try {
    s = await (await fetch('/api/update')).json();
  } catch(e) {
    return;
  }
  if (!s.checked) {
    if (triesLeft > 1) setTimeout(() => pollUpdate(triesLeft - 1), UPDATE_POLL_MS);
    return;
  }
  if (!s.available) return;
  updateInfo = s;
  document.getElementById('updateLink').textContent = 'Update available: v' + s.latest;
  document.getElementById('updateBar').hidden = false;
  document.getElementById('updateBtn').hidden = !s.can_install;
  renderUpdate();
}

// renderUpdate shows the update's progress, or why it can't start now.
function renderUpdate() {
  if (!updateInfo) return;
  const state = updateInfo.state || '';
  const busy = state in UPDATE_STEPS;
  const failed = state === 'failed';
  document.getElementById('updateBtn').disabled = busy || sparksRunning;
  const note = document.getElementById('updateNote');
  note.className = 'update-note' + (failed ? ' error' : '');
  if (busy) note.textContent = UPDATE_STEPS[state];
  else if (failed) note.textContent = 'Update failed: ' + updateInfo.error;
  else if (sparksRunning && updateInfo.can_install) note.textContent = 'Stop Sparks to update';
  else note.textContent = '';
}

async function installUpdate() {
  if (sparksRunning) return;
  if (!confirm('Update to v' + updateInfo.latest + '? Sparks will close and reopen. Save any settings changes first.')) return;
  const resp = await fetch('/api/update/install', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'
  });
  if (!resp.ok) {
    const data = await resp.json();
    updateInfo = {...updateInfo, state: 'failed', error: data.error};
    renderUpdate();
    return;
  }
  updateInfo = {...updateInfo, state: 'downloading', error: ''};
  renderUpdate();
  watchUpdate();
}

// watchUpdate follows the update until it fails or Sparks exits.
async function watchUpdate() {
  let s;
  try {
    s = await (await fetch('/api/update')).json();
  } catch(e) {
    return; // the old copy has exited; the new one opens its own window
  }
  updateInfo = s;
  renderUpdate();
  if (s.state in UPDATE_STEPS) setTimeout(watchUpdate, UPDATE_WATCH_MS);
}

// onPrereleaseChange warns when pre-releases are turned on.
function onPrereleaseChange(box) {
  if (!box.checked) return;
  box.checked = confirm('Pre-releases are test builds. They can have bugs and may include features ' +
    'never tried on real hardware, so don\'t rely on one for a contest.\n\n' +
    'Offer them anyway? Save your settings; this takes effect the next time Sparks starts.');
}

function openRelease() {
  fetch('/api/update/open', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'});
}

// --- Station (lempster-hearth) ---
// Everything hearth sends is rendered with textContent, never innerHTML.

// hearthGen increases whenever the station is (re)started from saved config.
// Every hearth request remembers the generation it started in and drops its
// reply if the station changed meanwhile, so one station's status can never
// drive the buttons for another.
let hearthGen = 0;
let hearthPollGen = null;          // generation whose status poll is in flight
let hearthIdentityFetchGen = null; // generation whose identity re-fetch is in flight

// lastHearthKey is the four hearth settings startHearth last (re)started with.
// null can't equal a real key, so the first call from init() always runs.
let lastHearthKey = null;

function startHearth(url) {
  // Start and Save call startHearth on every click, but the spec's own
  // routine is "wake the laptop, press Start" — a cold boot takes minutes, so
  // Start/Save mid-wake is normal. Only restart the station (and reset wolWaking,
  // the timers, hearthGen, etc.) when one of its four settings actually
  // changed; otherwise this is a no-op and the in-flight wake keeps running.
  const replicaUrl = document.getElementById('hearthReplicaUrl').value.trim();
  const token = document.getElementById('hearthToken').value;
  const key = JSON.stringify([url, replicaUrl, token, document.getElementById('hearthSite').value.trim()]);
  if (key === lastHearthKey) {
    // A Test of other settings may have replaced the identity line; show the
    // saved station's identity again.
    showIdentity(hearthIdentityRes);
    return;
  }
  lastHearthKey = key;

  if (hearthPoll) { clearInterval(hearthPoll); hearthPoll = null; }
  hearthGen++;
  hearthStatus = null;
  hearthIdentity = null;
  hearthIdentityRes = null;
  savedHearth = {url: url, replica_url: replicaUrl, token: token};
  wolTargets = [];
  wolFetchedAt = 0;
  wolWaking = {};
  lastLaptopSig = null; // force a re-render for the new station's rows
  if (wolTimer) { clearInterval(wolTimer); wolTimer = null; }
  resetStationView();
  document.getElementById('stationSection').hidden = !url;
  if (!url) return;
  fetchHearthIdentity().then(renderHearthControls);
  pollHearth();
  hearthPoll = setInterval(pollHearth, 10000);
  wolTimer = setInterval(wolTick, WOL_WAKE_POLL_MS);
}

// resetStationView blanks what was shown for the previous station and
// disables its controls until the new station answers.
function resetStationView() {
  const src = document.getElementById('stationSource');
  src.className = 'station-source';
  src.textContent = '—';
  document.getElementById('k4State').textContent = '—';
  renderPowerSave(null, 0);
  renderBattery(null, false);
  const id = document.getElementById('hearthIdentity');
  id.className = 'station-note';
  id.textContent = '';
  setStationMsg('', false);
  renderHearthControls();
}

async function testHearth() {
  const el = document.getElementById('hearthIdentity');
  el.className = 'station-note';
  el.textContent = 'Testing…';
  const tested = {
    url: document.getElementById('hearthUrl').value.trim(),
    replica_url: document.getElementById('hearthReplicaUrl').value.trim(),
    token: document.getElementById('hearthToken').value
  };
  const gen = hearthGen;
  const res = await whoami(tested);
  if (gen !== hearthGen) return; // the station changed while this was in flight
  // Only a Test of the saved settings speaks for the station. Any other Test
  // just shows its result, so unsaved settings never change what the station
  // controls allow.
  if (sameHearth(tested, savedHearth)) {
    hearthIdentityRes = res;
    hearthIdentity = res.error ? null : res;
  }
  showIdentity(res);
  renderHearthControls();
}

// fetchHearthIdentity asks hearth who the saved station's token belongs to.
// Its reply decides which station controls are enabled.
async function fetchHearthIdentity() {
  const gen = hearthGen;
  const res = await whoami(savedHearth);
  if (gen !== hearthGen) return; // the station changed while this was in flight
  hearthIdentityRes = res;
  hearthIdentity = res.error ? null : res;
  showIdentity(res);
}

// whoami posts hearth settings to /api/hearth/test and returns the identity,
// or {error} when the check fails.
async function whoami(body) {
  try {
    const resp = await fetch('/api/hearth/test', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    return await resp.json();
  } catch (e) {
    return {error: e.message};
  }
}

function sameHearth(a, b) {
  return !!a && !!b && a.url === b.url && a.replica_url === b.replica_url && a.token === b.token;
}

// showIdentity writes a whoami reply to the identity line on Settings; null
// blanks it.
function showIdentity(res) {
  const el = document.getElementById('hearthIdentity');
  if (!res) {
    el.className = 'station-note';
    el.textContent = '';
    return;
  }
  if (res.error) {
    el.className = 'station-note error';
    el.textContent = '✗ ' + res.error;
    return;
  }
  const who = res.owner ? 'owner' : res.name + ' · ' + (res.scopes || []).join(', ');
  el.className = 'station-note';
  el.textContent = '✓ ' + who + (res.replica ? ' (via replica)' : '');
}

function canUseHearth(scope) {
  return !!hearthIdentity && (hearthIdentity.owner || (hearthIdentity.scopes || []).includes(scope));
}

async function pollHearth() {
  const gen = hearthGen;
  if (hearthPollGen === gen) return; // this station's poll is already in flight
  hearthPollGen = gen;
  let status;
  try {
    const resp = await fetch('/api/hearth/status');
    status = await resp.json();
  } catch (e) {
    status = {source: 'unreachable', error: e.message};
  } finally {
    if (hearthPollGen === gen) hearthPollGen = null;
  }
  if (gen !== hearthGen) return; // the station changed; this status is for the old one
  hearthStatus = status;
  renderHearthStatus();
}

function fmtAge(sec) {
  if (sec < 90) return sec + 's';
  if (sec < 5400) return Math.round(sec / 60) + 'm';
  return (sec / 3600).toFixed(1) + 'h';
}

function ageSec(iso) {
  return Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
}

function fmtClock(iso) {
  return new Date(iso).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
}

function describeK4(k4) {
  switch (k4.card_state) {
    case 'on': {
      let t = 'ON';
      if (k4.freq_hz) t += ' · ' + (k4.freq_hz / 1e6).toFixed(3) + ' MHz';
      if (k4.mode) t += ' · ' + k4.mode;
      return t;
    }
    case 'off': return 'OFF';
    case 'unreachable': return 'unreachable';
    default: return 'unknown';
  }
}

// psHeld says whether a rig is holding the dish up through an armed down
// phase. Hearth builds that predate held_by never send it: absent is no hold.
function psHeld(ps) {
  return !!(ps && ps.enabled && ps.armed && ps.held_by);
}

// psPending says whether the replica holds an arm or disarm the cabin hasn't
// applied yet. The replica keeps desired as standing state and rewrites it to
// the Pi's own state once they agree, so a desired matching armed is not queued.
function psPending(ps) {
  return !!(ps && (ps.desired === 'on' || ps.desired === 'off') && ps.desired !== (ps.armed ? 'on' : 'off'));
}

// describePowerSave is the Power-save row's text. While a rig holds the dish
// up there is no "down until" countdown: the link stays up. pushAgeSec is the
// replica's push age (0 from the Pi); a hold older than 120 s is only as
// fresh as the cabin's last push.
function describePowerSave(ps, pushAgeSec) {
  if (!ps || !ps.enabled) return '—';
  let t;
  if (!ps.armed) t = 'disarmed';
  else if (psHeld(ps)) {
    t = 'armed · held up: ' + String(ps.held_by).toUpperCase() + ' on';
    if (pushAgeSec > 120) t += ' (as of last contact)';
  }
  else if (ps.phase === 'down' && ps.next_up_at) t = 'armed · down until ' + fmtClock(ps.next_up_at);
  else t = 'armed · ' + (ps.phase || 'up');
  if (psPending(ps)) {
    t += ' · ' + (ps.desired === 'on' ? 'arm' : 'disarm') + ' queued';
    if (ps.desired_by) t += ' by ' + ps.desired_by;
    if (ps.desired_at) t += ' ' + fmtAge(ageSec(ps.desired_at)) + ' ago';
  }
  return t;
}

// renderPowerSave fills the Power-save row; a held-up dish is amber.
function renderPowerSave(ps, pushAgeSec) {
  const val = document.getElementById('psState');
  val.className = 'station-value' + (psHeld(ps) ? ' warn' : '');
  val.textContent = describePowerSave(ps, pushAgeSec);
}

// describeReplicaSource is the source line when the status comes from the
// replica. While a rig holds the dish up the cabin isn't dark (only the Pi is
// out of reach), so the line drops "cabin dark" and the next-window time.
function describeReplicaSource(s) {
  const ps = s.powersave;
  const held = psHeld(ps);
  let t = 'Replica · ' + (held ? '' : 'cabin dark, ') + 'last heard ' + fmtAge(s.push_age_sec || 0) + ' ago';
  if (ps && ps.armed && ps.next_up_at && !held) t += ', next window ' + fmtClock(ps.next_up_at);
  if (ps && ps.overdue_sec > 0) t += ' — OVERDUE ' + fmtAge(ps.overdue_sec);
  if (s.error) t += ' — ' + s.error;
  return t;
}

// describeBattery is the Battery row's text, e.g. "87% · charging +120 W".
// On the replica the reading is as old as the last push or older, so its age
// is always shown; age_sec already includes the push's age.
function describeBattery(b, onReplica) {
  if (b.reported === false) return 'no reading';
  let t = Math.round(b.soc) + '%';
  const age = fmtAge(b.age_sec || 0);
  if (b.stale) return t + ' · stale (' + age + ')';
  const w = Math.round(Math.abs(b.power_w || 0));
  if (b.status === 'charging') t += ' · charging +' + w + ' W';
  else if (b.status === 'discharging') t += ' · discharging \u2212' + w + ' W';
  else if (b.status) t += ' · ' + b.status;
  if (onReplica) t += ' · ' + age + ' ago';
  return t;
}

// renderBattery shows the main battery, or hides the row when hearth sends
// no battery block (the site has none configured). Anything but a fresh
// reading from the Pi is amber.
function renderBattery(b, onReplica) {
  const row = document.getElementById('battRow');
  const val = document.getElementById('battState');
  row.hidden = !b;
  val.className = 'station-value' + (b && (onReplica || b.stale || b.reported === false) ? ' warn' : '');
  val.textContent = b ? describeBattery(b, onReplica) : '—';
}

function renderHearthStatus() {
  const s = hearthStatus;
  if (!s) return;
  const src = document.getElementById('stationSource');
  if (s.source === 'pi') {
    src.className = 'station-source live';
    src.textContent = 'Pi · live';
  } else if (s.source === 'replica') {
    src.className = 'station-source warn';
    src.textContent = describeReplicaSource(s);
  } else {
    src.className = 'station-source warn';
    src.textContent = 'Unreachable — ' + (s.error || 'no response');
  }
  document.getElementById('k4State').textContent = s.k4 ? describeK4(s.k4) : '—';
  endK4PowerOnWait(s);
  renderPowerSave(s.powersave, s.source === 'replica' ? (s.push_age_sec || 0) : 0);
  renderBattery(s.battery, s.source === 'replica');
  if (!hearthIdentity && s.source !== 'unreachable' && hearthIdentityFetchGen !== hearthGen) {
    const gen = hearthGen;
    hearthIdentityFetchGen = gen;
    fetchHearthIdentity().then(() => {
      if (hearthIdentityFetchGen === gen) hearthIdentityFetchGen = null;
      renderHearthControls();
    });
  }
  if (s.source !== 'pi') {
    wolWaking = {}; // no Pi, no wake to watch
  } else if (wolFetchedAt === 0) {
    fetchWol(); // first Pi status for this station
  }
  renderHearthControls();
}

// endK4PowerOnWait clears the pulse-power message once the Pi reads the K4
// on. A replica snapshot can predate the pulse, so its "on" doesn't count.
function endK4PowerOnWait(s) {
  if (k4PowerOnWait && s && s.source === 'pi' && s.k4 && s.k4.card_state === 'on') setStationMsg('', false);
}

// effectiveArmed is the power-save state the station is heading for. On the
// replica a queued change wins over the last pushed state, so the button can
// reverse a queued arm or disarm before the cabin checks in.
function effectiveArmed(s) {
  const ps = s && s.powersave;
  if (!ps) return false;
  if (s.source === 'replica' && (ps.desired === 'on' || ps.desired === 'off')) return ps.desired === 'on';
  return !!ps.armed;
}

// controlBlocker says why a station control can't be used right now, or ''
// when nothing outside the control's own state blocks it. The reason becomes
// the disabled button's tooltip: the identity line lives on Settings, so
// without it nothing on Operate says why a button is greyed out.
function controlBlocker(scope, piOnly) {
  const s = hearthStatus;
  if (!s) return 'waiting for hearth';
  if (s.source === 'unreachable') return 'hearth is unreachable';
  if (piOnly && s.source !== 'pi') return 'the cabin is dark — this needs the Pi';
  if (!hearthIdentity) return 'token not verified — use Test in Settings';
  if (!canUseHearth(scope)) return 'token lacks the "' + scope + '" scope';
  return '';
}

// controlState computes the {disabled, title} a control should show. It's
// split out from setControl so renderLaptopRows can compute the same values
// ahead of touching the DOM, to build a row signature before deciding
// whether a rebuild is needed.
function controlState(blocker, stateOk, stateReason) {
  return {disabled: !!blocker || !stateOk, title: blocker || (stateOk ? '' : stateReason)};
}

// setControl enables btn only when nothing blocks it and its own state allows
// it, and titles it with whichever reason applies.
function setControl(btn, blocker, stateOk, stateReason) {
  const cs = controlState(blocker, stateOk, stateReason);
  btn.disabled = cs.disabled;
  btn.title = cs.title;
}

function renderHearthControls() {
  const s = hearthStatus;
  const onReplica = !!s && s.source === 'replica';
  const k4 = s && s.k4;
  const ps = s && s.powersave;

  let k4Block = controlBlocker('k4', true);
  if (!k4Block && !k4) k4Block = 'hearth reports no K4';
  setControl(document.getElementById('k4OnBtn'),
    k4Block || (k4.power_relay ? '' : 'no power relay configured'),
    !!k4 && k4.card_state !== 'on', 'the K4 is already on');
  setControl(document.getElementById('k4OffBtn'), k4Block,
    !!k4 && k4.card_state === 'on', 'the K4 is not on');

  const psBtn = document.getElementById('psBtn');
  let psBlock = controlBlocker('powersave', false);
  if (!psBlock && !(ps && ps.enabled)) psBlock = 'power-save is not enabled at the cabin';
  setControl(psBtn, psBlock, true, '');
  const verb = effectiveArmed(s) ? 'disarm' : 'arm';
  psBtn.textContent = onReplica ? 'Queue ' + verb : verb.charAt(0).toUpperCase() + verb.slice(1);
  psBtn.className = verb === 'arm' ? 'danger' : '';
  renderLaptopRows();
}

// k4PowerOnWait is true while stationMsg shows the pulse-power message, which
// clears once the K4 reads on. Any other message ends the wait.
let k4PowerOnWait = false;

function setStationMsg(text, isError) {
  k4PowerOnWait = false;
  const el = document.getElementById('stationMsg');
  el.className = 'station-note' + (isError ? ' error' : '');
  el.textContent = text;
}

async function hearthPost(path, body) {
  const gen = hearthGen;
  const current = () => gen === hearthGen; // false once the station has changed
  try {
    const resp = await fetch(path, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    if (!resp.ok) {
      const text = await resp.text();
      if (current()) setStationMsg(text, true);
      return null;
    }
    const res = await resp.json();
    if (!current()) return null; // don't report the old station's result on the new one
    if (res.error) setStationMsg(res.error, true);
    return res;
  } catch (e) {
    if (current()) setStationMsg(e.message, true);
    return null;
  }
}

async function k4Power(power) {
  if (power === 'off') {
    let msg = 'Power OFF the cabin K4?';
    if (sparksRunning) msg += '\n\nSparks is connected to it — the CAT link will drop.';
    if (!confirm(msg)) return;
  }
  const res = await hearthPost('/api/hearth/k4', {power: power});
  if (res && res.ok) {
    setStationMsg(power === 'on' ? 'Pulsed power — waiting for the rig to come up' : 'Power-off sent', false);
    k4PowerOnWait = power === 'on';
  }
  pollHearth();
}

// armConfirmText is the question asked before arming. In a down phase with
// the K4 reading on, hearth holds the dish up while the K4 stays on, so the
// link doesn't drop until the K4 goes off.
function armConfirmText(s) {
  const ps = s && s.powersave;
  const onReplica = !!s && s.source === 'replica';
  if (onReplica && ps && ps.armed) {
    return 'Replace the queued disarm with arm? The cabin stays in power-save when it next checks in.';
  }
  if (onReplica) {
    return 'Queue arm? When the cabin next checks in, power-save arms and the dish drops.';
  }
  const until = ps && ps.next_up_at ? fmtClock(ps.next_up_at) : 'the next window';
  if (ps && ps.phase === 'down' && s.k4 && s.k4.card_state === 'on') {
    return 'Arm power-save? The K4 is on, so the dish stays up while it reads on. ' +
      'Once the K4 goes off, the dish drops and this link to the cabin is gone until ' + until + '.';
  }
  return 'Arm power-save? The dish drops IMMEDIATELY and this link to the cabin — including the K4 — is gone until ' + until + '.';
}

async function togglePowerSave() {
  const s = hearthStatus;
  const arm = !effectiveArmed(s);
  if (arm && !confirm(armConfirmText(s))) return;
  const res = await hearthPost('/api/hearth/powersave', {armed: arm});
  if (res && res.ok) {
    setStationMsg(res.queued
      ? 'Queued on the replica — the cabin picks it up at its next window'
      : (arm ? 'Power-save armed' : 'Power-save disarmed'), false);
  }
  pollHearth();
}

// --- Laptop wake (hearth wake-on-LAN) ---
// Hearth answers each WoL status by running tailscale and a ping on the Pi, so
// it is polled apart from the 10s station poll: every 60s while Operate is on
// screen, every 5s while a wake is in progress, and never while the cabin is
// dark. Target names come from hearth and are rendered with textContent.

const WOL_POLL_MS = 60000;
const WOL_WAKE_POLL_MS = 5000;
const WOL_WAKE_WINDOW_MS = 5 * 60 * 1000; // hearth's own window: a cold boot from S5 takes 2-4 min

let wolTargets = [];    // last targets from /api/hearth/wol for this station
let wolFetchedAt = 0;   // Date.now() when the last fetch finished; 0 = never
let wolFetchGen = null; // generation whose fetch is in flight
let wolWaking = {};     // name -> {until: ms, failed: bool}
let wolTimer = null;
// lastLaptopSig is the signature of what renderLaptopRows last put in the
// DOM. null can't equal a real signature, so the first render always runs.
// startHearth resets it to null so a station change always re-renders.
let lastLaptopSig = null;

function operateOnScreen() {
  return !document.getElementById('operateView').hidden && document.visibilityState === 'visible';
}

function waking(name) {
  const w = wolWaking[name];
  return !!w && !w.failed;
}

// expireWakes turns a wake whose window ran out into "didn't come up".
function expireWakes() {
  let changed = false;
  for (const w of Object.values(wolWaking)) {
    if (!w.failed && Date.now() >= w.until) {
      w.failed = true;
      changed = true;
    }
  }
  if (changed) renderLaptopRows();
}

// wolTick runs every 5s, and whenever Operate or the browser tab becomes
// visible again. It fetches only when the Pi is the source and a fetch is due.
function wolTick() {
  expireWakes();
  if (!hearthStatus || hearthStatus.source !== 'pi') return;
  const anyWaking = Object.keys(wolWaking).some(waking);
  if (!anyWaking && !operateOnScreen()) return;
  const due = anyWaking ? WOL_WAKE_POLL_MS : WOL_POLL_MS;
  if (Date.now() - wolFetchedAt < due - 500) return;
  fetchWol();
}

async function fetchWol() {
  const gen = hearthGen;
  if (wolFetchGen === gen) return; // this station's fetch is already in flight
  wolFetchGen = gen;
  let res;
  try {
    const resp = await fetch('/api/hearth/wol');
    res = await resp.json();
  } catch (e) {
    res = {error: e.message};
  } finally {
    if (wolFetchGen === gen) wolFetchGen = null;
  }
  if (gen !== hearthGen) return; // the station changed; these targets are for the old one
  wolFetchedAt = Date.now();
  if (res.error) {
    // Keep the rows but mark them unknown: a failed read is never "asleep".
    wolTargets = wolTargets.map(t => ({name: t.name, online: null, source: 'none'}));
  } else {
    wolTargets = res.targets || [];
    for (const t of wolTargets) {
      if (t.online === true) delete wolWaking[t.name];
    }
  }
  renderLaptopRows();
}

function describeLaptop(t) {
  if (!hearthStatus || hearthStatus.source !== 'pi') return 'unknown'; // no Pi, no WoL: never the replica
  if (t.online === true) return 'awake';
  const w = wolWaking[t.name];
  if (w) return w.failed ? "didn't come up" : 'waking…';
  if (t.online === false) return 'asleep';
  return 'unknown';
}

// renderLaptopRows rebuilds the laptop rows only when something rendered
// actually changed. Every 10s status poll calls this, and rebuilding the DOM
// every time replaces the Wake button under a click in progress, drops
// keyboard focus, and closes an open "why disabled" tooltip — so the row
// signature (name, status text, whether Wake is shown, disabled, title) is
// compared against the last render first.
function renderLaptopRows() {
  const box = document.getElementById('laptopRows');
  const rows = wolTargets.map(t => {
    // Wake is offered only to a token whose whoami allows it; without the
    // scope hearth answers 403, so there is nothing to press. Status still shows.
    const showWake = canUseHearth('wol');
    const cs = showWake
      ? controlState(controlBlocker('wol', true), !waking(t.name), 'waking — watching for it to come up')
      : null;
    return {name: t.name, status: describeLaptop(t), showWake: showWake, disabled: cs && cs.disabled, title: cs && cs.title};
  });
  const sig = JSON.stringify(rows);
  if (sig === lastLaptopSig) return;
  lastLaptopSig = sig;

  box.replaceChildren();
  for (const r of rows) {
    const row = document.createElement('div');
    row.className = 'station-row';
    const label = document.createElement('span');
    label.className = 'station-label';
    label.textContent = r.name;
    label.title = r.name;
    const value = document.createElement('span');
    value.className = 'station-value';
    value.textContent = r.status;
    row.append(label, value);
    if (r.showWake) {
      const btn = document.createElement('button');
      btn.textContent = 'Wake';
      btn.disabled = r.disabled;
      btn.title = r.title;
      btn.onclick = () => wakeLaptop(r.name);
      row.append(btn);
    }
    box.append(row);
  }
}

async function wakeLaptop(name) {
  const res = await hearthPost('/api/hearth/wol', {name: name});
  if (!res || !res.ok) return; // hearthPost has already shown the error
  setStationMsg('Wake sent to ' + name, false);
  wolWaking[name] = {until: Date.now() + WOL_WAKE_WINDOW_MS, failed: false};
  renderLaptopRows();
}

document.addEventListener('visibilitychange', wolTick);

init();
pollUpdate();
</script>
</body>
</html>
